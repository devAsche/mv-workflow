<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1500px;height:500px;overflow:hidden}
.c{position:relative;width:1500px;height:500px;overflow:hidden;
 background:radial-gradient(520px 520px at 1150px 260px,#2d3a8c 0%,transparent 70%),linear-gradient(115deg,#080b26 0%,#141a4d 60%,#1d2466 100%)}
.wave{position:absolute;left:990px;top:0;height:500px;width:470px;display:flex;align-items:center;justify-content:space-between}
.wave i{display:block;width:22px;border-radius:11px;background:#4fe3e0}
.wave i:nth-child(even){background:#a99cff}
.char{position:absolute;left:1050px;top:40px;height:600px;filter:drop-shadow(0 20px 30px rgba(2,4,20,.65))}
.name{position:absolute;left:250px;top:175px;font:800 150px/1 'Unbounded';letter-spacing:-.03em;color:#f4f5ff}
.name span{color:#4fe3e0}
</style></head><body><div class="c">
<div class="wave" id="w"></div>
<img class="char" src="avatar_trim.png">
<div class="name">Ashley<span>.</span></div>
</div>
<script>
const hs=[110,190,140,270,210,330,170,300,240,150,230,120];
const w=document.getElementById('w');hs.forEach(h=>{const e=document.createElement('i');e.style.height=h+'px';e.style.opacity=.85;w.appendChild(e)});
</script></body></html>
